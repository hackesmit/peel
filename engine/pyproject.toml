[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peel-engine"
version = "0.1.0"
description = "Peel engine: data-driven file conversion, tool and action registry"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The engine itself has no dependencies on purpose: it runs with whatever
# backends are present and hides the entries whose backend is missing. These
# are what the test suite needs to BUILD its fixtures and to RE-OPEN outputs
# with the library that owns each format, so `pip install -e .[dev]` is enough
# to reproduce a full run. The two native backends (LibreOffice, pandoc) are
# not pip installable and the tests that need them skip when they are absent.
dev = [
    "pytest>=8",
    "pillow",
    # Held to the 1.26 line: pymupdf 2.x pulls in pymupdf_layout and
    # onnxruntime, and changes find_tables output (phantom empty columns).
    "pymupdf>=1.26,<1.27",
    "pdf2docx",
    "python-docx",
    "python-pptx",
    "openpyxl",
]

[project.scripts]
peel = "peel_engine.cli:main"

[tool.setuptools.packages.find]
include = ["peel_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
