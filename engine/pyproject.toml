[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peel-engine"
version = "0.1.0"
description = "Peel engine: data-driven file conversion, tool and action registry"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
peel = "peel_engine.cli:main"

[tool.setuptools.packages.find]
include = ["peel_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
